services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: wa
      POSTGRES_PASSWORD: wa
      POSTGRES_DB: wa
    volumes: [pgdata:/var/lib/postgresql/data]

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://wa:wa@db:5432/wa
      MEDIA_DIR: /data/media
    volumes: [media:/data/media]
    ports: ["8000:8000"]
    depends_on: [db]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  media:
